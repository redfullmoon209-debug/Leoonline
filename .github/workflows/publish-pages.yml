name: Publish Leoonline Web Playtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pages.yml'
      - '911/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/test_web_inventory.cjs'
      - 'tools/test_release_combat_boot.cjs'
      - 'tools/test_phone_shell.cjs'
      - 'tools/create_mobile_shell.py'
      - 'tools/create_landscape_shell.py'
      - 'tools/test_landscape_shell.cjs'
      - 'tools/check_female_asset.gd'
      - 'tools/prepare_female_character.py'
      - 'tools/prepare_bangkok_map.py'
      - 'tools/verify_camera_controls.gd'
      - 'tools/test_release_camera_controls.cjs'
      - 'tools/verify_bangkok_map.gd'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: leoonline-pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Get Godot and web templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j -q templates.tpz 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Generate standalone Novice PNG assets
        run: python3 tools/create_skill_pngs.py
      - name: Generate 84 independent first-tier profession PNGs
        run: python3 tools/create_profession_skill_pngs.py
      - name: Reassemble exact FemaleLeo.fbx uploaded by project owner
        run: |
          python3 tools/prepare_female_character.py
          test -s assets/characters/female/FemaleLeo.fbx
      - name: Reconstruct and verify original Bangkok map geometry
        run: |
          python3 tools/prepare_bangkok_map.py
          test -s assets/maps/bangkok_map.glb
      - name: Export site
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee import.log
          # Godot 4.4.1 headless's dummy texture driver can log a known
          # harmless embedded FBX texture import warning (texture_2d_get with null handle).
          # Continue to reject every other import error; validate the model
          # and skeleton in tools/check_female_asset.gd immediately afterward.
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' import.log | grep -vF 'ERROR: Parameter "t" is null.'; then exit 1; fi
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://scripts/smoke_test.gd 2>&1 | tee smoke.log
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/check_female_asset.gd 2>&1 | tee female-model-qa.log
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/verify_bangkok_map.gd 2>&1 | tee bangkok-map-qa.log
          echo "BANGKOK_CAMERA_QA_BEGIN"
          timeout 60s ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://tools/verify_camera_controls.gd 2>&1 | tee camera-controls-qa.log
          echo "BANGKOK_CAMERA_QA_END"
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' female-model-qa.log; then exit 1; fi
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' bangkok-map-qa.log; then exit 1; fi
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' camera-controls-qa.log; then exit 1; fi
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' smoke.log; then exit 1; fi
          mkdir -p build/web
          # Each deployment has its own Godot entry point and PCK/JS/WASM paths.
          # This prevents browsers and GitHub Pages CDN from mixing old and new
          # game files when users revisit the same /Leoonline/ URL.
          game_id="game-${GITHUB_SHA:0:12}"
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web "build/web/${game_id}.html"
          for ext in html pck js wasm; do test -s "build/web/${game_id}.${ext}"; done
          # Keep the usual index URL functional while giving every release a
          # direct, never-before-used URL for reliable fresh loads.
          cp "build/web/${game_id}.html" build/web/index.html
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          name = "game-" + os.environ["GITHUB_SHA"][:12]
          page = Path("build/web/index.html").read_text()
          for required in (f'src="{name}.js"', f'"executable":"{name}"',
                           f'"{name}.pck"', f'"{name}.wasm"'):
              assert required in page, f"Versioned Godot asset missing from HTML: {required}"
          print("Verified cache-independent Godot entrypoint:", name + ".html")
          PYCODE
          printf '{"commit":"%s","entrypoint":"%s.html"}\n' "$GITHUB_SHA" "$game_id" > build/web/build-info.json
          echo "Standalone Godot runtime: https://redfullmoon209-debug.github.io/Leoonline/${game_id}.html" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p build/web/911
          cp 911/index.html 911/manifest.webmanifest 911/icon.svg 911/sw.js build/web/911/
          # A standalone, clickable 16:9 skill UI concept preview (not the game runtime).
          cp 911/skill-landscape-preview.html build/web/skill-landscape-preview.html
          test -s build/web/skill-landscape-preview.html
          test -s build/web/911/manifest.webmanifest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runtime
        run: |
          npm install --prefix /tmp/leo-browser --no-save playwright@1.56.1
          /tmp/leo-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser release gate - prove ATK walks toward locked enemy
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE: /tmp/leo-browser/node_modules/playwright
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('build/web/index.html')
          test_html=p.read_text().replace('const engine = new Engine(GODOT_CONFIG);', 'GODOT_CONFIG.args = ["--", "--inventory-qa"];\nconst engine = new Engine(GODOT_CONFIG);')
          Path('build/web/_qa.html').write_text(test_html)
          PYCODE
          python3 -m http.server 8000 --directory build/web > /tmp/leo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f build/web/_qa.html' EXIT
          # The FULL multi-page HUD/GM/Shop regression runs separately on
          # pull_request via hud-browser-check.yml. Do not block public
          # playtesting for unrelated, very long UI-sweep test suites.
          # Keep the critical gate: live browser must start and prove
          # CharacterBody actually RUNS after pressing ATK and Slash.
          timeout 120s node tools/test_release_combat_boot.cjs
          timeout 120s node tools/test_release_camera_controls.cjs
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Leoonline-browser-QA
          path: build/web/qa/
          if-no-files-found: warn
      - name: Make the portrait phone view the default Leoonline website
        run: |
          set -euo pipefail
          game_id="game-${GITHUB_SHA:0:12}"
          phone_id="phone-${GITHUB_SHA:0:12}"
          python3 tools/create_mobile_shell.py --web build/web --game "${game_id}.html" --output "${phone_id}.html" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          web = Path("build/web")
          data = json.loads((web/"build-info.json").read_text())
          assert data["display"]=="mobile-portrait"
          for name in ("index.html","mobile.html",data["entrypoint"]):
              content=(web/name).read_text()
              assert 'id="phone-shell"' in content
              assert f'src="{data["game_entrypoint"]}"' in content
              assert "aspect-ratio: 9 / 19.5" in content
          assert (web/data["game_entrypoint"]).exists()
          print("Public website now serves a real responsive phone viewport.")
          PY
          echo "Open phone portrait: https://redfullmoon209-debug.github.io/Leoonline/${phone_id}.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Make LANDSCAPE the default homepage, preserve portrait at mobile.html
        run: |
          set -euo pipefail
          game_id="game-${GITHUB_SHA:0:12}"
          landscape_id="landscape-${GITHUB_SHA:0:12}"
          python3 tools/create_landscape_shell.py --web build/web --game "${game_id}.html" --output "${landscape_id}.html" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          web=Path("build/web")
          data=json.loads((web/"build-info.json").read_text())
          assert data["display"] == "mobile-portrait"
          assert data["landscape_test_entrypoint"].startswith("landscape-")
          for filename in ("landscape.html","landscape-test.html",data["landscape_test_entrypoint"]):
              page=(web/filename).read_text()
              assert 'id="landscape-shell"' in page
              assert 'id="game-frame"' in page
              assert f'src="{data["game_entrypoint"]}?mobile_ui=1&amp;gm_test=1"' in page
              assert 'LANDSCAPE TEST' in page
          # Keep the verified landscape test URL unchanged (including its GM
          # test flag), but publish a clean player-facing horizontal homepage.
          # This iframe is a REAL adaptive Godot viewport, not a rotated image.
          primary = (web/"landscape.html").read_text(encoding="utf-8")
          assert '?mobile_ui=1&amp;gm_test=1' in primary
          primary = primary.replace('?mobile_ui=1&amp;gm_test=1', '?mobile_ui=1')
          primary = primary.replace(
              '<title>LEOONLINE - ทดสอบแนวนอน</title>',
              '<title>LEOONLINE - เล่นเกมแนวนอน</title>')
          primary = primary.replace(
              'content="Leoonline - playable landscape mode test"',
              'content="Leoonline - fullscreen landscape game"')
          primary = primary.replace(
              '<span>LEOONLINE</span><span class="test-badge">LANDSCAPE TEST</span>',
              '<span>LEOONLINE</span>')
          primary = primary.replace(
              'Leoonline แนวนอนรุ่นทดสอบ', 'Leoonline แนวนอน')
          primary = primary.replace(
              'Leoonline รุ่นทดสอบแนวนอน จะแสดงเกมเต็มจอเมื่อหมุนเครื่อง',
              'Leoonline จะแสดงเกมเต็มจอเมื่อหมุนโทรศัพท์เป็นแนวนอน')
          primary = primary.replace(
              '<a href="mobile.html">กลับไปเล่นแบบแนวตั้ง</a>',
              '<span>หากจอไม่หมุน ให้เปิดใน Safari และปิดล็อกแนวตั้งของ iPhone</span>'
              '<a href="mobile.html">เล่นแบบแนวตั้งแทน</a>')
          # Only the homepage fills PC and mobile screens without the testing
          # frame; the verified versioned landscape QA pages remain untouched.
          primary = primary.replace('  </style>', """    /* Fullscreen, responsive live game on the public homepage. */
    .test-header { display: none; }
    #landscape-shell {
      width: 100vw; height: 100vh; height: 100dvh;
      max-width: none; aspect-ratio: auto;
      border: 0; border-radius: 0; box-shadow: none;
    }
    #game-frame { border-radius: 0; }
  </style>""")
          (web/"index.html").write_text(primary, encoding="utf-8")
          # Portrait remains a separate playable entrypoint and shares saves.
          assert 'id="landscape-shell"' in primary
          assert 'id="rotate-prompt"' in primary
          assert 'src="' + data["game_entrypoint"] + '?mobile_ui=1"' in primary
          assert 'gm_test=1' not in primary
          assert 'id="phone-shell"' in (web/"mobile.html").read_text()
          data["display"] = "mobile-landscape"
          data["default_entrypoint"] = "index.html"
          data["portrait_alias"] = "mobile.html"
          (web/"build-info.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          assert 'id="phone-shell"' in (web/"mobile.html").read_text()
          print("Default homepage is playable LANDSCAPE. Portrait stays on mobile.html.")
          PY
          echo "Play LANDSCAPE by default: https://redfullmoon209-debug.github.io/Leoonline/" >> "$GITHUB_STEP_SUMMARY"
          echo "Portrait alternative: https://redfullmoon209-debug.github.io/Leoonline/mobile.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
