name: Publish Leoonline Web Playtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pages.yml'
      - '911/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'tools/test_web_inventory.cjs'
      - 'tools/test_phone_shell.cjs'
      - 'tools/create_mobile_shell.py'
      - 'tools/create_landscape_shell.py'
      - 'tools/test_landscape_shell.cjs'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: leoonline-pages-v2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Get Godot and web templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j -q templates.tpz 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Export site
        run: |
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee import.log
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' import.log; then exit 1; fi
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --script res://scripts/smoke_test.gd 2>&1 | tee smoke.log
          if grep -E '(SCRIPT ERROR:|ERROR:|Parse Error:|Failed to load script)' smoke.log; then exit 1; fi
          mkdir -p build/web
          # Each deployment has its own Godot entry point and PCK/JS/WASM paths.
          # This prevents browsers and GitHub Pages CDN from mixing old and new
          # game files when users revisit the same /Leoonline/ URL.
          game_id="game-${GITHUB_SHA:0:12}"
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web "build/web/${game_id}.html"
          for ext in html pck js wasm; do test -s "build/web/${game_id}.${ext}"; done
          # Keep the usual index URL functional while giving every release a
          # direct, never-before-used URL for reliable fresh loads.
          cp "build/web/${game_id}.html" build/web/index.html
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          name = "game-" + os.environ["GITHUB_SHA"][:12]
          page = Path("build/web/index.html").read_text()
          for required in (f'src="{name}.js"', f'"executable":"{name}"',
                           f'"{name}.pck"', f'"{name}.wasm"'):
              assert required in page, f"Versioned Godot asset missing from HTML: {required}"
          print("Verified cache-independent Godot entrypoint:", name + ".html")
          PYCODE
          printf '{"commit":"%s","entrypoint":"%s.html"}\n' "$GITHUB_SHA" "$game_id" > build/web/build-info.json
          echo "Standalone Godot runtime: https://redfullmoon209-debug.github.io/Leoonline/${game_id}.html" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p build/web/911
          cp 911/index.html 911/manifest.webmanifest 911/icon.svg 911/sw.js build/web/911/
          test -s build/web/911/manifest.webmanifest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA runtime
        run: |
          npm install --prefix /tmp/leo-browser --no-save playwright@1.56.1
          /tmp/leo-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test release Web export with real desktop and mobile browser input
        env:
          PLAYWRIGHT_MODULE: /tmp/leo-browser/node_modules/playwright
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('build/web/index.html')
          test_html=p.read_text().replace('const engine = new Engine(GODOT_CONFIG);', 'GODOT_CONFIG.args = ["--", "--inventory-qa"];\nconst engine = new Engine(GODOT_CONFIG);')
          Path('build/web/_qa.html').write_text(test_html)
          PYCODE
          python3 -m http.server 8000 --directory build/web > /tmp/leo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f build/web/_qa.html build/web/_phone_qa.html build/web/_landscape_qa.html' EXIT
          # First execute the entire existing desktop/mobile inventory and HUD
          # test suite against the unmodified Godot export.
          node tools/test_web_inventory.cjs
          # Then run the SAME actual game as a real 9:19.5 browser viewport
          # inside a desktop phone frame and an edge-to-edge mobile frame.
          python3 tools/create_mobile_shell.py --web build/web --game _qa.html --output _phone_qa.html
          node tools/test_phone_shell.cjs
          # Landscape is a separate TEST entrypoint. It runs the same game
          # at a real horizontal aspect ratio, never replacing portrait /.
          python3 tools/create_landscape_shell.py --web build/web --game _qa.html --output _landscape_qa.html
          node tools/test_landscape_shell.cjs
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Leoonline-browser-QA
          path: build/web/qa/
          if-no-files-found: warn
      - name: Make the portrait phone view the default Leoonline website
        run: |
          set -euo pipefail
          game_id="game-${GITHUB_SHA:0:12}"
          phone_id="phone-${GITHUB_SHA:0:12}"
          python3 tools/create_mobile_shell.py --web build/web --game "${game_id}.html" --output "${phone_id}.html" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          web = Path("build/web")
          data = json.loads((web/"build-info.json").read_text())
          assert data["display"]=="mobile-portrait"
          for name in ("index.html","mobile.html",data["entrypoint"]):
              content=(web/name).read_text()
              assert 'id="phone-shell"' in content
              assert f'src="{data["game_entrypoint"]}"' in content
              assert "aspect-ratio: 9 / 19.5" in content
          assert (web/data["game_entrypoint"]).exists()
          print("Public website now serves a real responsive phone viewport.")
          PY
          echo "Open phone portrait: https://redfullmoon209-debug.github.io/Leoonline/${phone_id}.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish separate landscape playtest without changing portrait default
        run: |
          set -euo pipefail
          game_id="game-${GITHUB_SHA:0:12}"
          landscape_id="landscape-${GITHUB_SHA:0:12}"
          python3 tools/create_landscape_shell.py --web build/web --game "${game_id}.html" --output "${landscape_id}.html" --publish
          python3 - <<'PY'
          import json
          from pathlib import Path
          web=Path("build/web")
          data=json.loads((web/"build-info.json").read_text())
          assert data["display"] == "mobile-portrait"
          assert data["landscape_test_entrypoint"].startswith("landscape-")
          for filename in ("landscape.html","landscape-test.html",data["landscape_test_entrypoint"]):
              page=(web/filename).read_text()
              assert 'id="landscape-shell"' in page
              assert 'id="game-frame"' in page
              assert f'src="{data["game_entrypoint"]}?mobile_ui=1&amp;gm_test=1"' in page
              assert 'LANDSCAPE TEST' in page
          assert 'id="phone-shell"' in (web/"index.html").read_text()
          assert 'id="phone-shell"' in (web/"mobile.html").read_text()
          print("Both live playtests published: portrait main and optional landscape.")
          PY
          echo "Open separate LANDSCAPE test: https://redfullmoon209-debug.github.io/Leoonline/${landscape_id}.html" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
