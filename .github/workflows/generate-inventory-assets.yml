name: Verify existing approved inventory assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the original PNG files without generating or modifying artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(Path('assets/ui/approved').glob('*.png'))
          assert len(files) == 10, 'Expected exactly ten approved PNG originals'
          for path in files:
              payload = path.read_bytes()
              assert payload.startswith(b'\x89PNG\r\n\x1a\n'), str(path)
              print(hashlib.sha256(payload).hexdigest(), path)
          PY
