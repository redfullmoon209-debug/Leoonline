name: Inspect approved UI ZIP
on:
  push:
    paths:
      - '.github/workflows/inspect-ui-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing approved ZIP without altering any images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from hashlib import sha256
          p=Path('Leoonline_Approved_PNG_Direct.zip')
          print('ARCHIVE', p, p.stat().st_size)
          with ZipFile(p) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  data=z.read(item.filename)
                  print('ASSET',item.filename, 'BYTES',len(data),'SHA256',sha256(data).hexdigest())
                  if sha256(data).hexdigest()=='dc89d5fecc27ab56ba14b901c5287bf95b8aa19fe88e6c90f14c1d6f20dc52c5':
                      print('MATCH_EXACT_USER_UPLOAD', item.filename)
          PY
