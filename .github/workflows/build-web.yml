name: Build Leoonline Web Playtest
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and matching web export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -o export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          unzip -j -q export_templates.tpz 'templates/*' -d "$HOME/.local/share/godot/export_templates/4.4.1.stable"
      - name: Import project
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Export browser version
        run: |
          mkdir -p build/web
          ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
      - name: Upload playable web build (private Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Leoonline-Web-Playtest
          path: build/web/
          if-no-files-found: error
          retention-days: 14
