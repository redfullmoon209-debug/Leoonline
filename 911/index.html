<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>911 | Game Command Center</title><style>body{margin:0;background:#080e1c;color:#e8eefc;font:16px system-ui,sans-serif}main{max-width:800px;margin:auto;padding:36px 18px}h1{color:#f1ca75;font-size:48px;margin:0}.card{border:1px solid #45628d;background:#111d35;border-radius:18px;padding:24px;margin:18px 0}textarea{box-sizing:border-box;width:100%;height:140px;background:#091426;color:white;border:1px solid #54719e;border-radius:12px;padding:15px;font:inherit}button,a.action{display:inline-block;background:#d9ae58;color:#11182a;border:0;border-radius:10px;padding:13px 20px;font-weight:700;text-decoration:none;cursor:pointer;margin-top:12px}small{color:#9fb1d1}.status{color:#ffd783}a{color:#95c7ff}</style></head><body><main><h1>911</h1><p>GAME DEVELOPMENT COMMAND CENTER · ระบบสั่งงานเกม</p><div class="card"><h2>คำสั่งจากลูกพี่</h2><textarea id="order" placeholder="ตัวอย่าง: ปรับ UI กระเป๋า Leoonline ให้เหมือนภาพต้นแบบ ใช้ PNG แยก Layer และทดสอบก่อน Deploy"></textarea><br><button onclick="send()">สร้างคำสั่งสำหรับ GPT</button><p id="result" class="status"></p></div><div class="card"><h2>สถานะการเชื่อมต่อ</h2><p>GitHub: <a href="https://github.com/redfullmoon209-debug/Leoonline/actions" target="_blank">ดูผล Build</a></p><p>เกม: <a href="https://redfullmoon209-debug.github.io/Leoonline/" target="_blank">เปิด Leoonline</a></p><p>GPT Agent: <span class="status">ยังไม่ได้เชื่อมต่อ — ต้องมีช่องทาง API/Agent ที่ได้รับอนุญาต</span></p><small>911 เวอร์ชันเริ่มต้นนี้ไม่ส่งคำสั่งไป GPT โดยอัตโนมัติ และไม่เก็บรหัสผ่านหรือ API Key</small></div></main><script>function send(){const v=document.getElementById('order').value.trim();if(!v){document.getElementById('result').textContent='กรุณาใส่คำสั่ง';return}const q='คำสั่งพัฒนาเกม Leoonline จาก 911:\n'+v+'\nโปรดทำงานใน GitHub ตรวจ Build และรายงานตามจริง ห้ามอ้างว่าสำเร็จโดยไม่มีผลทดสอบ';navigator.clipboard.writeText(q).then(()=>document.getElementById('result').textContent='คัดลอกคำสั่งแล้ว — วางในแชท GPT เพื่อเริ่มงาน').catch(()=>document.getElementById('result').textContent='ไม่สามารถคัดลอกอัตโนมัติ กรุณาคัดลอกข้อความจากช่องคำสั่ง')} </script></body></html>
